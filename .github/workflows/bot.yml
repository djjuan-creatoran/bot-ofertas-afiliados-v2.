name: Executar Bot de Ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: bot-ofertas-main
  cancel-in-progress: false

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar bot
        run: python bot.py

      - name: Guardar histórico como artefato
        uses: actions/upload-artifact@v4
        with:
          name: historico-ofertas
          path: ofertas_publicadas.json
          if-no-files-found: error
          retention-days: 30
