name: Executar Bot de Ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar bot
        run: python bot.py

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas_publicadas.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico de ofertas"
            git push
          else
            echo "Nenhuma alteração no histórico."
          fi
